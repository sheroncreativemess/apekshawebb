<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#04060b;color:#d8e1ef;font-family:Georgia,'Times New Roman',serif}button{font:inherit}

#stanza-panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:5vh 8vw;pointer-events:none}.card{max-width:min(680px,84vw);text-align:center;opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}.card.show{opacity:1;transform:none}.card p{font-size:clamp(1.02rem,2.2vw,1.34rem);line-height:1.9;font-style:italic;color:var(--text);white-space:pre-line;text-shadow:0 2px 4px #000,0 0 18px rgba(0,0,0,.8)}.card.final p{font-size:clamp(1.1rem,2.7vw,1.52rem);color:var(--pink2)}

body.act4 .card{background:radial-gradient(ellipse at 50% 50%,rgba(4,6,14,.62) 0%,rgba(4,6,14,.42) 48%,rgba(4,6,14,.12) 74%,transparent 90%);border-radius:28px;padding:4.5vh 4vw}

.mirror-dot{position:fixed;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);z-index:16;cursor:pointer;background:transparent;pointer-events:auto}.mirror-dot::before{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:var(--pink2);box-shadow:0 0 9px 3px rgba(255,165,196,.68),0 0 20px 7px rgba(245,126,163,.25);transition:transform .25s,box-shadow .25s}.mirror-dot:hover::before,.mirror-dot.hint::before{transform:translate(-50%,-50%) scale(1.65);box-shadow:0 0 13px 5px rgba(255,188,211,.88),0 0 28px 9px rgba(245,126,163,.32)}.mirror-dot.done::before{background:#fff0f5;box-shadow:0 0 12px 5px rgba(255,207,220,.84)}

.star-point{position:fixed;transform:translate(-50%,-50%);border-radius:50%;z-index:11;cursor:pointer;background:#f2e7c9;box-shadow:0 0 8px 3px rgba(240,230,200,.42);transition:transform .2s,box-shadow .2s}.star-point.hint{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.32);box-shadow:0 0 11px 4px rgba(245,200,130,.6)}}
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(4,6,11,.97);transition:opacity 1s}.intro-inner{text-align:center}.intro-inner h1{font-size:clamp(1.4rem,4vw,2.1rem);font-weight:400;font-style:italic;letter-spacing:.12em;color:#c9d3e5}.intro-inner p{margin-top:1.5rem;font-size:.88rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(200,212,232,.4)}#begin{margin-top:2rem;padding:.7rem 2.3rem;border:1px solid rgba(200,212,232,.22);background:none;color:rgba(200,212,232,.62);cursor:pointer;font-style:italic;letter-spacing:.17em}#begin:hover{color:var(--pink2);border-color:rgba(245,140,175,.45)}

<script>
const ACT1=[
{lines:`You speak and even time leans in;\nthe world forgets its pace.\nIn this quiet stillness\neverything within me finally finds its place.`,size:5},
{lines:`And when the night shows its starry skies,\nyour name becomes the breaker of silence\nbetween the stars.\nA gentle warmth I can't touch,\nyet somehow know is yours.`,size:4.5},
{lines:`I live where your light still falls,\nlike a tide that loves the moon too much\nto ever learn relief.`,size:4},
{lines:`For every step toward dawn reveals\na piece of what I want,\nyet every hour spent beneath this sky\ndraws me farther from myself too.`,size:4},
{lines:`The seasons come at my door,\nasking me to pick a path.\nBut one path leaves your echo behind,\nand so I stand near a flame\nnot willing to depart.`,size:4.5},
{lines:`knowing the night will never choose me.\n\nwhich absence breaks the heart`,size:5,final:true}
];
const ACT2=[
{lines:`Some people wait for sunsets;\nI find myself waiting for your words.\nA few minutes become hours,\nand somehow still feels too short.`,size:5.2},
{lines:`That's why I'd welcome any hour that brings you\neven the ones the world is asleep for,\nwhen the sky is still deciding\nwhat it wants to be.`,size:4.8},
{lines:`There is something about you—\nthe way your eyes hold light,\nthe way you smile,\nthat makes leaving a conversation hanging\nfeel a little like\npausing your favorite story before the final page.`,size:4.6},
{lines:`And maybe that's all this is:\nthe quiet wish to know every version of you,\nthe stories you tell,\nand the ones you keep for yourself.`,size:5.0},
{lines:`Every person is a universe.\n\nAll I want is to learn to live in yours.`,size:6.4,final:true}
];
const ACT3=[
{lines:`It's strange\nhow some voices\nleave the room\nlong before the echo.`,size:5.0},
{lines:`Some conversations\nfeel less like talking\nand more like finding home.`,size:5.1},
{lines:`There are laughs\nthat disappear with the moment,\nand then there are the rare ones\nthat replay\nwhile the rest of the day\ntries to bloom.`,size:4.7},
{lines:`If this you are Before Sunrise,\nmorning can wait.\nIf this you were a movie,\nthe credits can keep rolling.`,size:5.0},
{lines:`Some endings\ndon't feel unfinished.\nThey just sound like\na sentence\nthat deserved\none more reply.`,size:6.4,final:true}
];
const ACT4=[
{lines:`Somehow the stars look dimmer when you walk into view,\nas if heaven misplaced its brightest hue in you.`,size:5.3},
{lines:`And I know I said too much,\nthen somehow said too few;\nmy thoughts keep wandering the world\njust to circle back to you.`,size:4.8},
{lines:`I could listen to your silence,\nlet your quiet fill the room,\nfor somehow even empty words\nmake something beautiful bloom.`,size:4.7},
{lines:`And if I could gather every shadow\nthat still lingers in your mind,\nI'd leave them where they cannot reach you,\nsomewhere far behind.`,size:4.8},
{lines:`There are doors I wish you'd open,\nrooms I wish that I could see,\nnames I wish were spoken softly,\nplaces you'd go with me.`,size:4.9},
{lines:`But I'd rather know you laughing\nthan the reasons you once cried,\nso I'll never pull the curtains\nfrom the places where you hide.`,size:4.8},
{lines:`Because what good is knowing everything\nif knowing makes you ache?\nWhen my own day is heavy,\nyou still make something in me wake.`,size:5.0},
{lines:`You are more than pretty words\ncould ever properly explain,\nmore than moonlight on the ocean,\nmore than sunlight after rain.`,size:4.9},
{lines:`And if loving your existence\nmeans protecting what you hide,\nthen I'll happily know the surface,\nwith your happiness beside.`,size:5.1},
{lines:`Maybe someday you'll tell me.\nMaybe someday you won't.\n\nBut if the price of keeping peace\nis leaving certain stories through,\n\nI'd still choose you.`,size:6.0,final:true}
];
const ACT5=[
{lines:`Some feelings arrive without asking their way in,\nhalf-formed, half-frightened, and difficult to name,\nlike a thought caught somewhere between the door and the hinge,\na match that burns without much of a flame.`,size:4.8},
{lines:`there are things that don't surface when spoken,\nlittle fractures kept carefully out of the light\nand chances say I might be wrong,\nbut I notice some weight`,size:5.0},
{lines:`There are days when concern becomes clumsy with care,\nwhen wanting to help only makes things feel strange;\nwhen the heart gets ahead of whatever makes sense,\nand means something gentle, but says it all wrong anyway.`,size:4.6},
{lines:`Still\nthere are certain things that remain hard to miss:\nthe kind of beauty that doesn't require a mirror,\nthe kind that exists in the curve of a smile\nand somehow becomes even clearer,\nthe kind that lives underneath skin and expression,\nin the way you make softness look almost effortless.`,size:4.3},
{lines:`Apeksha,\na name that sounds like a question left open,\na breath held somewhere between hop ;\nand if there is something you're carrying quietly,\nI hope it gets lighter before you  break.`,size:4.9},
{lines:`No fixing, no answers, no reason to explain,\nno expectation disguised as concern;\njust a quiet hope that when things become heavy,\nyou'll give yourself the same grace you give others in return.`,size:4.7},
{lines:`And if this came out crooked,\nif the words caught somewhere between intention and impact,\nlet them be what they were meant to be\nnot a hand pulling,\njust one left there,\nin case you need something`,size:5.6,final:true}
];
const POS1=[{x:.18,y:.22},{x:.72,y:.16},{x:.44,y:.38},{x:.82,y:.52},{x:.25,y:.62},{x:.60,y:.72}];
const POS2=[{x:.72,y:.30},{x:.568,y:.122},{x:.322,y:.19},{x:.322,y:.41},{x:.50,y:.82}];

const POS4=[{x:.25,y:.10},{x:.75,y:.10},{x:.50,y:.42},{x:.72,y:.55},{x:.89,y:.80},{x:.39,y:.88},{x:.64,y:.84}];
let act=1,started=false,stanzas=ACT1.slice(),stars=[],revealed=0,animating=false,finished=false,dismissTimer=null;
const act4Audio=document.getElementById('act4-audio'),audioToggle=document.getElementById('audio-toggle');
const ACT4_VOL=0.55;
function fadeAudio(el,to,dur=800,onDone){
  const from=el.volume,t0=performance.now();
  function step(now){
    const t=Math.max(0,Math.min(1,(now-t0)/dur));
    el.volume=Math.max(0,Math.min(1,from+(to-from)*t));
    if(t<1)requestAnimationFrame(step);else if(onDone)onDone();
  }
  requestAnimationFrame(step);
}
/* Called synchronously inside a click handler, before any setTimeout delay, so the
   browser still counts it as a user-gesture-triggered play (autoplay policies require this). */
function primeAct4Audio(){
  try{
    act4Audio.currentTime=0;
    act4Audio.volume=0;
    const p=act4Audio.play();
    if(p&&p.catch)p.catch(()=>{});
    audioToggle.classList.remove('muted');
  }catch(e){}
}
function stopAct4Audio(){
  if(!act4Audio.paused){
    fadeAudio(act4Audio,0,500,()=>act4Audio.pause());
  }
}
audioToggle.onclick=(e)=>{
  e.stopPropagation();
  if(act4Audio.paused){
    const p=act4Audio.play();
    if(p&&p.catch)p.catch(()=>{});
    fadeAudio(act4Audio,ACT4_VOL,500);
    audioToggle.classList.remove('muted');
  }else{
    fadeAudio(act4Audio,0,400,()=>act4Audio.pause());
    audioToggle.classList.add('muted');
  }
};
const card=document.getElementById('card'),counter=document.getElementById('counter'),dismiss=document.getElementById('dismiss');
let ctx=document.getElementById('sky').getContext('2d'),W=0,H=0,bg=[];
function resize(){W=document.getElementById('sky').width=innerWidth;H=document.getElementById('sky').height=innerHeight}
function seed(){bg=[];for(let i=0;i<Math.floor(W*H/4200);i++)bg.push({x:Math.random()*W,y:Math.random()*H,r:.2+Math.random()*.8,a:.25+Math.random()*.55,t:Math.random()*6.28})}
function draw(){ctx.fillStyle='#04060b';ctx.fillRect(0,0,W,H);for(const s of bg){s.t+=.01;ctx.globalAlpha=s.a*(.78+.22*Math.sin(s.t));ctx.fillStyle='#eef3ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();s.y-=.006;if(s.y<0)s.y=H}ctx.globalAlpha=1}
function raf(ts){draw();requestAnimationFrame(raf)}
function pointsPath(points){return points.map((p,i)=>(i?'L':'M')+p.x.toFixed(2)+','+p.y.toFixed(2)).join(' ')}
function rosePts(inner=false){let out=[],n=inner?60:140,r0=inner?.115:.24;for(let i=0;i<=n;i++){let t=i/n*Math.PI*2,r=inner?(r0*(1-i/n)+.014):(r0*(.5+.5*Math.cos(5*t)));out.push({x:.5+r*Math.cos(t),y:.3+r*Math.sin(t)*.85})}return out}
function heartRaw(n){let a=[];for(let i=0;i<=n;i++){let t=i/n*Math.PI*2;a.push({x:16*Math.sin(t)**3,y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)})}return a}
function heartPts(scale=1){let r=heartRaw(140),xs=r.map(p=>p.x),ys=r.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);return r.map(p=>({x:.5+((((p.x-x0)/(x1-x0))-.5)*.56*scale),y:.45-((((p.y-y0)/(y1-y0))-.5)*.50*scale)}))}
function setActGroup(name){document.querySelectorAll('.group').forEach(g=>g.classList.remove('active'));if(name)document.getElementById(name).classList.add('active')}
function clearStarDOM(){document.querySelectorAll('.star-point,.mirror-dot').forEach(e=>e.remove());stars=[];document.getElementById('act4-transition')?.classList.remove('show')}
function makeStars(pos,arr,cls=''){clearStarDOM();revealed=0;pos.forEach((p,i)=>{let e=document.createElement('div');e.className='star-point'+(cls?' '+cls:'');e.style.left=p.x*100+'%';e.style.top=p.y*100+'%';let sz=i===arr.length-1?7:Math.max(4,arr[i].size||5);e.style.width=e.style.height=sz+'px';e.dataset.i=i;e.onclick=clickStar;document.body.appendChild(e);stars.push(e)});if(stars[0])stars[0].classList.add('hint')}
function clickStar(e){let i=+e.currentTarget.dataset.i;if(i!==revealed||animating)return;revealed++;e.currentTarget.classList.remove('hint');e.currentTarget.style.boxShadow='0 0 12px 4px rgba(255,186,207,.75)';showStanza(i);if(i+1<stars.length)setTimeout(()=>stars[i+1]?.classList.add('hint'),700);}
function showStanza(i){
  animating=true;
  clearTimeout(dismissTimer);
  let s=stanzas[i];
  card.classList.toggle('final',!!s.final);
  card.classList.remove('show');
  setTimeout(()=>{
    card.innerHTML='';
    let p=document.createElement('p');
    s.lines.split('').forEach(ch=>{
      let span=document.createElement('span');
      span.className='char';
      span.textContent=ch;
      if(ch==='\n')span.style.display='block';
      p.appendChild(span);
    });
    card.appendChild(p);
    card.classList.add('show');
    let chars=[...p.children],k=0;
    let tick=()=>{
      if(k<chars.length){
        chars[k++].classList.add('on');
        setTimeout(tick,Math.max(15,900/chars.length));
      }else{
        animating=false;
        if(s.final){
          finished=true;
          counter.style.opacity=0;
          dismiss.classList.remove('show');

          setTimeout(()=>{
            const transition=document.getElementById('act4-transition');
            if(act<5){
              transition.classList.add('show');
            }
          },700);
        }else{
          counter.textContent=`✦ ${i+1} of ${stanzas.length-1} · find the next star`;
          dismiss.classList.add('show');
        }
        dismissTimer=setTimeout(
          hideCard,
          Math.max(4500,Math.min(11000,2200+s.lines.split(/\s+/).length*250))
        );
      }
    };
    tick();
  },330);
}
function hideCard(){clearTimeout(dismissTimer);card.classList.remove('show');dismiss.classList.remove('show');if(finished)counter.style.opacity=0}
function mirrorPoints(){
  const n=16;
  const cx=50;
  const cy=52;
  const rx=45.2;
  const ry=43.0;
  const valleyRx=40.8;
  const valleyRy=38.9;
  const peaks=[],vals=[];
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*(Math.PI*2/n);
    const v=a+Math.PI/n;
    peaks.push({
      x:cx+Math.cos(a)*rx,
      y:cy+Math.sin(a)*ry
    });
    vals.push({
      x:cx+Math.cos(v)*valleyRx,
      y:cy+Math.sin(v)*valleyRy
    });
  }

  return {peaks,vals,inner:11.5,cx,cy};
}
function buildMirror(){
  const {peaks,vals,inner,cx,cy}=mirrorPoints();
  const outer=document.getElementById('mirror-outer');
  const g=document.getElementById('mirror-spokes');
  const eg=document.getElementById('mirror-edges');
  const sg=document.getElementById('mirror-stars');
  let d=`M ${peaks[0].x.toFixed(2)} ${peaks[0].y.toFixed(2)}`;
  for(let i=0;i<peaks.length;i++){
    const v=vals[i],next=peaks[(i+1)%peaks.length];
    d+=` Q ${v.x.toFixed(2)} ${v.y.toFixed(2)} ${next.x.toFixed(2)} ${next.y.toFixed(2)}`;
  }
  outer.setAttribute('d',d+' Z');
  g.innerHTML='';
  eg.innerHTML='';
  sg.innerHTML='';
  /* EXACTLY 16 radial lines, each starting flush on the inner circle's rim */
  for(let i=0;i<16;i++){
    const a=-Math.PI/2+i*Math.PI*2/16;
    const ix=cx+Math.cos(a)*inner;
    const iy=cy+Math.sin(a)*inner;
    const p=peaks[i];
    const line=document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d',`M ${ix.toFixed(2)} ${iy.toFixed(2)} L ${p.x.toFixed(2)} ${p.y.toFixed(2)}`);
    line.setAttribute('class',i%4===0?'spoke strong':'spoke');
    g.appendChild(line);
    const star=document.createElementNS('http://www.w3.org/2000/svg','circle');
    star.setAttribute('cx',p.x);
    star.setAttribute('cy',p.y);
    star.setAttribute('r',i%4===0?'.92':'.56');
    star.setAttribute('class',i%4===0?'mirror-star':'mirror-star');
    sg.appendChild(star);
  }
  /* Only the wavy perimeter, no web of extra geometry. */
  for(let i=0;i<16;i++){
    const a=peaks[i],b=peaks[(i+1)%16];
    const line=document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d',`M ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)}`);
    line.setAttribute('class','edge');
    eg.appendChild(line);
  }
}
function getMirrorClickPositions(){
  const {peaks}=mirrorPoints();
  const ids=[0,1,3,5,7,8,10,12,14,15];
  return ids.map(i=>({x:peaks[i].x/100,y:peaks[i].y/100}));
}
function addMirrorDots(){
  document.querySelectorAll('.mirror-dot').forEach(e=>e.remove());
  getMirrorClickPositions().forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='mirror-dot';
    d.style.left=p.x*100+'%';
    d.style.top=p.y*100+'%';
    d.dataset.i=i;
    d.setAttribute('aria-label',`Act 4 star ${i+1}`);
    d.onclick=clickMirrorDot;
    document.body.appendChild(d);
    if(i===0)d.classList.add('hint');
  });
}
function clickMirrorDot(e){
  const i=+e.currentTarget.dataset.i;
  if(i!==revealed||animating)return;
  e.currentTarget.classList.add('done');
  e.currentTarget.classList.remove('hint');
  revealed++;
  showStanza(i);
  const dots=[...document.querySelectorAll('.mirror-dot')];
  dots[i+1]?.classList.add('hint');
}
function beginAct4(){
  act=4;
  stanzas=ACT4.slice();
  finished=false;
  revealed=0;
  document.body.classList.add('act4');
  document.getElementById('moon-scene').classList.add('show');
  document.getElementById('reading-veil').classList.add('show');
  document.getElementById('final-glow').classList.remove('show');
  document.getElementById('act4-transition').classList.remove('show');
  setActGroup('mirror-lines');
  buildMirror();
  addMirrorDots();
  counter.style.opacity=1;
  counter.textContent='touch a star  ✦';
  showCaption('moon-caption');
  if(act4Audio.paused){primeAct4Audio();}
  fadeAudio(act4Audio,ACT4_VOL,1200);
}
function beginAct1(){act=1;stanzas=ACT1.slice();finished=false;revealed=0;stopAct4Audio();document.body.classList.remove('act4');document.getElementById('act4-transition').classList.remove('show');document.getElementById('moon-scene').classList.remove('show');document.getElementById('reading-veil').classList.remove('show');document.getElementById('final-glow').classList.remove('show');buildMirror();setActGroup(null);makeStars(POS1,ACT1);counter.style.opacity=1;counter.textContent='touch a star  ✦'}
function beginAct2(){act=2;stanzas=ACT2.slice();finished=false;revealed=0;stopAct4Audio();document.body.classList.remove('act4');document.getElementById('act4-transition').classList.remove('show');document.getElementById('moon-scene').classList.remove('show');document.getElementById('reading-veil').classList.remove('show');setActGroup('rose-lines');let o=rosePts(),inn=rosePts(true);document.getElementById('rose-outer').setAttribute('d',pointsPath(o)+' Z');document.getElementById('rose-inner').setAttribute('d',pointsPath(inn));makeStars(POS2,ACT2,'rose-star');counter.style.opacity=1;counter.textContent='touch a star  ✦';showCaption('rose-caption')}
function beginAct3(){act=3;stanzas=ACT3.slice();finished=false;revealed=0;stopAct4Audio();document.body.classList.remove('act4');document.getElementById('act4-transition').classList.remove('show');document.getElementById('moon-scene').classList.remove('show');document.getElementById('reading-veil').classList.remove('show');setActGroup('heart-lines');let o=heartPts(1),inn=heartPts(.58);document.getElementById('heart-outer').setAttribute('d',pointsPath(o)+' Z');document.getElementById('heart-inner').setAttribute('d',pointsPath(inn));makeStars(POS3,ACT3,'heart-star');counter.style.opacity=1;counter.textContent='touch a star  ✦';showCaption('heart-caption')}
function beginAct5(){act=5;stanzas=ACT5.slice();finished=false;revealed=0;stopAct4Audio();document.body.classList.remove('act4');document.getElementById('act4-transition').classList.remove('show');document.getElementById('moon-scene').classList.remove('show');document.getElementById('reading-veil').classList.remove('show');document.getElementById('final-glow').classList.remove('show');setActGroup('cat-lines');makeStars(POS4,ACT5,'cat-star');counter.style.opacity=1;counter.textContent='touch a star  ✦';showCaption('cat-caption')}
function pointsPath(p){return p.map((x,i)=>(i?'L':'M')+(x.x*100).toFixed(2)+','+(x.y*100).toFixed(2)).join(' ')}
function showCaption(id){document.querySelectorAll('.sky-caption').forEach(e=>e.classList.remove('show'));let e=document.getElementById(id);if(e){e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3200)}}
function finale(){document.getElementById('final-glow').classList.add('show');let n=55;for(let i=0;i<n;i++){let p=document.createElement('div');p.className='burst';p.style.setProperty('--a',Math.random()*360+'deg');p.style.setProperty('--d',90+Math.random()*Math.min(innerWidth,innerHeight)*.42+'px');p.style.setProperty('--dur',1.2+Math.random()*1.8+'s');document.body.appendChild(p);setTimeout(()=>p.remove(),3600)}}
/* Space-travel warp transition used specifically when entering Act IV: overlay dims to near-black, streaks fly outward from center like passing stars, a brief white flash marks arrival, then Act IV's mirror sky is revealed underneath as the overlay clears. */
function playWarpTransition(cb){
  const overlay=document.createElement('div');
  overlay.id='warp-overlay';
  document.body.appendChild(overlay);
  const cap=document.getElementById('warp-caption');
  requestAnimationFrame(()=>{overlay.classList.add('show');cap.classList.add('show')});
  setTimeout(()=>{
    const n=100;
    for(let i=0;i<n;i++){
      const s=document.createElement('div');
      s.className='warp-streak';
      const angle=Math.random()*360;
      const len=(45+Math.random()*75).toFixed(1)+'vmax';
      const dur=(.55+Math.random()*.55).toFixed(2)+'s';
      s.style.setProperty('--wlen',len);
      s.style.setProperty('--wdur',dur);
      s.style.transform=`rotate(${angle}deg)`;
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1300);
    }
  },140);
  setTimeout(()=>{
    cb();
  },760);
  setTimeout(()=>{
    const flash=document.createElement('div');
    flash.className='warp-flash';
    document.body.appendChild(flash);
    requestAnimationFrame(()=>flash.classList.add('show'));
    setTimeout(()=>{flash.classList.remove('show');setTimeout(()=>flash.remove(),250)},170);
  },780);
  setTimeout(()=>{
    cap.classList.remove('show');
    overlay.classList.remove('show');
    setTimeout(()=>overlay.remove(),650);
  },1000);
}
function continueToNextAct(){
  const transition=document.getElementById('act4-transition');
  transition.classList.remove('show');
  if(act===1){
    beginAct2();
  }else if(act===2){
    beginAct3();
  }else if(act===3){
    primeAct4Audio();
    playWarpTransition(beginAct4);
  }else if(act===4){
    beginAct5();
  }else{
 
    finale();
  }
}
document.getElementById('act4-transition').onclick=continueToNextAct;
function jump(n){if(!started){started=true;document.getElementById('intro').style.opacity=0;setTimeout(()=>document.getElementById('intro').remove(),900)}hideCard();if(n===4)primeAct4Audio();if(n===1)beginAct1();if(n===2)beginAct2();if(n===3)beginAct3();if(n===4)beginAct4();if(n===5)beginAct5();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',+b.dataset.act===n))}
document.getElementById('begin').onclick=()=>jump(1);document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>jump(+b.dataset.act));document.addEventListener('click',e=>{if(e.target.closest('.star-point,.mirror-dot,#nav,#intro,#audio-toggle'))return;if(card.classList.contains('show'))hideCard()});window.addEventListener('resize',()=>{resize();seed();if(act===4){buildMirror();addMirrorDots()}});resize();seed();buildMirror();requestAnimationFrame(raf);
</script>
