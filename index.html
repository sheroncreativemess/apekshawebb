<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>knowing the night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void: #050810;
    --deep: #0a0f1e;
    --midnight: #0f1628;
    --silver: #c8d4e8;
    --starwhite: #f0f4ff;
    --amber: #e8c87a;
    --amber-dim: #a8893a;
    --poem-text: #dde6f5;
    --rose: #e0748c;
    --rose-dim: #a84f63;
    --redstar: #ff4d4d;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--silver);
    cursor: default;
    user-select: none;
  }

  /* ── CANVAS LAYER ── */
  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── AURORA ── */
  #aurora {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38vh;
    background: linear-gradient(
      to top,
      rgba(10, 20, 50, 0.0),
      rgba(15, 40, 80, 0.12) 30%,
      rgba(10, 30, 60, 0.06) 70%,
      transparent
    );
    z-index: 1;
    pointer-events: none;
    animation: aurora-breathe 12s ease-in-out infinite alternate;
  }

  @keyframes aurora-breathe {
    0%   { opacity: 0.4; transform: scaleY(1); }
    50%  { opacity: 0.7; transform: scaleY(1.08); }
    100% { opacity: 0.45; transform: scaleY(0.96); }
  }

  /* ── STARS (clickable) ── */
  .star-point {
    position: fixed;
    border-radius: 50%;
    background: var(--starwhite);
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
    transition: box-shadow 0.4s ease;
    animation: heartbeat var(--hb, 3s) ease-in-out infinite;
  }

  .star-point::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
  }

  .star-point.active {
    background: var(--amber);
    box-shadow: 0 0 8px 3px rgba(232,200,122,0.5), 0 0 24px 8px rgba(232,200,122,0.15);
    animation: none;
  }

  .star-point.pulse-hint {
    animation: hint-pulse 2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { box-shadow: 0 0 2px 1px rgba(240,244,255,0.3); opacity: 0.8; }
    50%       { box-shadow: 0 0 6px 2px rgba(240,244,255,0.5); opacity: 1; }
  }

  @keyframes hint-pulse {
    0%, 100% { box-shadow: 0 0 4px 2px rgba(232,200,122,0.2), 0 0 12px 4px rgba(232,200,122,0.08); transform: translate(-50%,-50%) scale(1); }
    50%       { box-shadow: 0 0 10px 4px rgba(232,200,122,0.5), 0 0 28px 10px rgba(232,200,122,0.18); transform: translate(-50%,-50%) scale(1.18); }
  }

  /* ── STANZA PANEL ── */
  #stanza-panel {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .stanza-card {
    max-width: min(580px, 88vw);
    text-align: center;
    padding: 0 1.5rem;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none;
  }

  .stanza-card.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: none;
  }

  .stanza-card p {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    line-height: 1.95;
    color: var(--poem-text);
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.01em;
    white-space: pre-line;
  }

  .stanza-card p .char {
    display: inline;
    opacity: 0;
    transition: opacity 0.04s ease;
  }

  /* ── FINAL STANZA ── */
  .stanza-card.final p {
    font-size: clamp(1.1rem, 2.8vw, 1.5rem);
    color: var(--amber);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* ── INTRO OVERLAY ── */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
    background: rgba(5,8,16,0.96);
    transition: opacity 1.2s ease;
  }

  #intro.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #intro h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 300;
    font-style: italic;
    color: var(--silver);
    letter-spacing: 0.12em;
    opacity: 0.7;
  }

  #intro p {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: clamp(0.85rem, 1.8vw, 1rem);
    color: rgba(200, 212, 232, 0.4);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  #begin-btn {
    background: none;
    border: 1px solid rgba(200,212,232,0.2);
    color: rgba(200,212,232,0.55);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1rem;
    font-style: italic;
    letter-spacing: 0.2em;
    padding: 0.65rem 2.2rem;
    cursor: pointer;
    transition: all 0.4s ease;
    border-radius: 1px;
  }

  #begin-btn:hover {
    color: rgba(232,200,122,0.8);
    border-color: rgba(232,200,122,0.35);
  }

  /* ── COUNTER / HINT ── */
  #counter {
    position: fixed;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    color: rgba(200,212,232,0.25);
    text-transform: uppercase;
    transition: opacity 0.6s;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ── DISMISS HINT ── */
  #dismiss-hint {
    position: fixed;
    bottom: 2.5rem;
    right: 2.5rem;
    z-index: 30;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: rgba(200,212,232,0.18);
    text-transform: uppercase;
    font-family: 'Cormorant Garamond', Georgia, serif;
    pointer-events: none;
    transition: opacity 0.6s;
    opacity: 0;
  }

  #dismiss-hint.visible {
    opacity: 1;
    pointer-events: all;
    cursor: pointer;
  }

  /* ── SHOOTING STAR ── */
  .shoot {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    animation: shoot-anim 0.8s ease-out forwards;
    transform-origin: left center;
  }

  @keyframes shoot-anim {
    0%   { opacity: 1; transform: scaleX(1); }
    60%  { opacity: 0.6; transform: scaleX(60); }
    100% { opacity: 0; transform: scaleX(100) translateX(40px); }
  }

  /* ── END BLOOM ── */
  #end-bloom {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(232,200,122,0.07) 0%, transparent 70%);
    transition: opacity 3s ease;
  }

  #end-bloom.lit { opacity: 1; }

  /* ── RED STAR (act transition) ── */
  .star-point.red-star { background: var(--redstar); }

  .star-point.red-star.pulse-hint {
    animation: red-hint-pulse 1.8s ease-in-out infinite;
  }

  @keyframes red-hint-pulse {
    0%, 100% { box-shadow: 0 0 6px 3px rgba(255,77,77,0.35), 0 0 16px 6px rgba(255,77,77,0.12); transform: translate(-50%,-50%) scale(1); }
    50%       { box-shadow: 0 0 14px 5px rgba(255,77,77,0.6), 0 0 34px 12px rgba(255,77,77,0.25); transform: translate(-50%,-50%) scale(1.22); }
  }

  .star-point.red-star.active {
    background: #ff2f2f;
    box-shadow: 0 0 10px 4px rgba(255,60,60,0.6), 0 0 30px 10px rgba(255,60,60,0.25);
    animation: none;
  }

  /* ── ROSE CONSTELLATION STARS ── */
  .star-point.rose-star { background: var(--rose); }

  /* ── WARP / HYPERSPACE FLASH ── */
  #warp-flash {
    position: fixed;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
  }

  body.warping #warp-flash {
    animation: warp-flash-anim 2.2s ease-in-out forwards;
  }

  @keyframes warp-flash-anim {
    0%   { opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0%, transparent 70%); }
    45%  { opacity: 0.4; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.55) 0%, rgba(200,70,80,0.18) 40%, transparent 78%); }
    100% { opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0%, transparent 70%); }
  }

  body.warping #sky { filter: brightness(1.15); }

  /* ── CONSTELLATION LINE ART (rose) ── */
  #constellation-lines {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 9;
    pointer-events: none;
  }

  #rose-lines {
    opacity: 0;
    transition: opacity 2.2s ease;
  }

  #rose-lines.visible { opacity: 1; }

  #rose-lines path {
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  #rose-lines path.curve {
    stroke: rgba(224,116,140,0.55);
    stroke-width: 1.1;
  }

  #rose-lines path.curve.inner {
    stroke: rgba(232,150,168,0.5);
    stroke-width: 0.9;
  }

  #rose-lines path.stem {
    stroke: rgba(200,110,130,0.6);
    stroke-width: 1.2;
  }

  #rose-lines path.leaf {
    stroke: rgba(120,180,120,0.4);
    fill: rgba(120,180,120,0.05);
    stroke-width: 0.9;
  }

  /* ── ROSE DUST (scattered detail stars along the curve) ── */
  .rose-dust {
    position: fixed;
    border-radius: 50%;
    background: rgba(228,140,158,0.75);
    box-shadow: 0 0 4px 1px rgba(224,116,140,0.4);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 8;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .rose-dust.visible { opacity: 1; }

  /* ── ROSE CAPTION ── */
  #rose-caption {
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    letter-spacing: 0.1em;
    color: rgba(224,116,140,0.6);
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }

  #rose-caption.visible { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .star-point, .stanza-card, #aurora, .shoot { animation: none; transition: none; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="aurora"></div>
<div id="end-bloom"></div>
<div id="warp-flash"></div>

<svg id="constellation-lines" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <g id="rose-lines">
    <path id="rose-outer" class="curve" d="" />
    <path id="rose-inner" class="curve inner" d="" />
    <path class="stem" d="M50,47 Q47,64 50,76 Q52,84 50,92" />
    <path class="leaf" d="M50,63 Q39,60 32,69 Q41,74 50,67 Z" />
    <path class="leaf" d="M50,70 Q61,67 68,76 Q59,81 50,74 Z" />
  </g>
</svg>

<div id="rose-caption">a second constellation begins to bloom</div>

<div id="stanza-panel">
  <div class="stanza-card" id="active-card"></div>
</div>

<div id="counter">touch a star</div>
<div id="dismiss-hint" id="dismiss-hint">click anywhere to continue ·</div>

<div id="intro">
  <h1>knowing the night</h1>
  <p>a poem in stars</p>
  <button id="begin-btn">enter the sky</button>
</div>

<script>
// ─────────────────────────────────────────────
//  POEM DATA
// ─────────────────────────────────────────────
let stanzas = [
  {
    lines: `You speak and even time leans in;\nthe world forgets its pace.\nIn this quiet stillness\neverything within me finally finds its place.`,
    size: 5
  },
  {
    lines: `And when the night shows its starry skies,\nyour name becomes the breaker of silence\nbetween the stars.\nA gentle warmth I can't touch,\nyet somehow know is yours.`,
    size: 4.5
  },
  {
    lines: `I live where your light still falls,\nlike a tide that loves the moon too much\nto ever learn relief.`,
    size: 4
  },
  {
    lines: `For every step toward dawn reveals\na piece of what I want,\nyet every hour spent beneath this sky\ndraws me farther from myself too.`,
    size: 4
  },
  {
    lines: `The seasons come at my door,\nasking me to pick a path.\nBut one path leaves your echo behind,\nand so I stand near a flame\nnot willing to depart.`,
    size: 4.5
  },
  {
    lines: `knowing the night will never choose me.\n\nwhich absence breaks the heart`,
    size: 5,
    final: true
  }
];

const stanzas2 = [
  {
    lines: `Some people wait for sunsets;\nI find myself waiting for your words.\nA few minutes become hours,\nand somehow still feels too short.`,
    size: 6
  },
  {
    lines: `That's why I'd welcome any hour that brings you \neven the ones the world is asleep for,\nwhen the sky is still deciding\nwhat it wants to be.`,
    size: 5.5
  },
  {
    lines: `There is something about you—\nthe way your eyes hold light,\nthe way you smile,\nthat makes leaving a conversation hanging\nfeel a little like\npausing your favorite story before the final page.`,
    size: 5
  },
  {
    lines: `And maybe that's all this is:\nthe quiet wish to know every version of you,\nthe stories you tell,\nand the ones you keep for yourself.`,
    size: 5.5
  },
  {
    lines: `Every person is a universe.\n\nAll I want is to learn to live in yours.`,
    size: 7,
    final: true
  }
];

// rose-shaped constellation: five-petal bloom (generated curve) with a stem root.
// Star positions sit on four of the five petal tips plus the stem's root.
const ROSE_CENTER = { x: 0.50, y: 0.30 };
const ROSE_OUTER_R = 0.24;
const ROSE_Y_SQUASH = 0.85;

const rosePositions = [
  { x: 0.720, y: 0.300 },  // t = 0°   — east petal tip
  { x: 0.568, y: 0.122 },  // t = 288° — upper-right petal tip
  { x: 0.322, y: 0.190 },  // t = 216° — upper-left petal tip
  { x: 0.322, y: 0.410 },  // t = 144° — lower-left petal tip
  { x: 0.500, y: 0.920 }   // stem root — final line, grounded
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let revealed = 0;
let animating = false;
let started = false;
let act = 1;
let total = stanzas.length;

// ─────────────────────────────────────────────
//  CANVAS — drifting starfield
// ─────────────────────────────────────────────
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let W, H;
let bgStars = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function makeBgStars(n) {
  bgStars = [];
  for (let i = 0; i < n; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 0.9 + 0.15,
      spd: Math.random() * 0.012 + 0.003,
      drift: (Math.random() - 0.5) * 0.008,
      alpha: Math.random() * 0.5 + 0.3,
      flick: Math.random() * Math.PI * 2
    });
  }
}

function drawBg() {
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);

  // subtle galaxy band
  const grd = ctx.createLinearGradient(W*0.1, H*0.1, W*0.9, H*0.85);
  grd.addColorStop(0, 'rgba(12,18,45,0)');
  grd.addColorStop(0.5, 'rgba(14,22,55,0.18)');
  grd.addColorStop(1, 'rgba(12,18,45,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  for (let s of bgStars) {
    s.flick += 0.015;
    const a = s.alpha * (0.75 + 0.25 * Math.sin(s.flick));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f0f4ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y -= s.spd;
    s.x += s.drift;
    if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
    if (s.x < 0) s.x = W;
    if (s.x > W) s.x = 0;
  }
  ctx.globalAlpha = 1;
}

let raf;
let warping = false;
let warpStart = 0;
const WARP_DURATION = 2200;
let warpParticles = [];

function spawnWarpParticles(n) {
  for (let i = 0; i < n; i++) {
    warpParticles.push({
      angle: Math.random() * Math.PI * 2,
      dist: Math.random() * 40,
      speed: 4 + Math.random() * 6
    });
  }
}

function drawWarp(progress) {
  const cx = W / 2, cy = H / 2;
  ctx.fillStyle = 'rgba(5,8,16,0.55)';
  ctx.fillRect(0, 0, W, H);

  const speedBoost = Math.sin(progress * Math.PI); // eases up then down
  spawnWarpParticles(Math.floor(6 + speedBoost * 14));
  ctx.lineCap = 'round';

  for (let i = warpParticles.length - 1; i >= 0; i--) {
    const p = warpParticles[i];
    const sx = cx + Math.cos(p.angle) * p.dist;
    const sy = cy + Math.sin(p.angle) * p.dist;
    p.dist += p.speed * (1 + speedBoost * 7);
    const ex = cx + Math.cos(p.angle) * p.dist;
    const ey = cy + Math.sin(p.angle) * p.dist;
    const alpha = Math.min(1, speedBoost + 0.15);
    ctx.strokeStyle = `rgba(240,244,255,${alpha})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (p.dist > Math.max(W, H)) warpParticles.splice(i, 1);
  }
}

function loop(ts) {
  if (warping) {
    const progress = Math.min(1, (ts - warpStart) / WARP_DURATION);
    drawWarp(progress);
  } else {
    drawBg();
  }
  raf = requestAnimationFrame(loop);
}

// ─────────────────────────────────────────────
//  CLICKABLE STARS — positions
// ─────────────────────────────────────────────
// Distributed across sky quadrants for a natural constellation feel
const starPositions = [
  { x: 0.18, y: 0.22 },
  { x: 0.72, y: 0.16 },
  { x: 0.44, y: 0.38 },
  { x: 0.82, y: 0.52 },
  { x: 0.25, y: 0.62 },
  { x: 0.60, y: 0.72 }   // final — center-ish lower
];

const starEls = [];

function buildStars() {
  starPositions.forEach((pos, i) => {
    const el = document.createElement('div');
    el.className = 'star-point' + (i === 0 ? ' pulse-hint' : '');
    el.style.setProperty('--hb', `${2.8 + i * 0.4}s`);
    el.style.left = `${pos.x * 100}%`;
    el.style.top = `${pos.y * 100}%`;
    const sz = i === total - 1 ? 7 : stanzas[i].size;
    el.style.width = el.style.height = `${sz}px`;
    el.dataset.index = i;
    el.addEventListener('click', onStarClick);
    document.body.appendChild(el);
    starEls.push(el);
  });
}

let redStarEl = null;

function buildRedStar() {
  const el = document.createElement('div');
  el.className = 'star-point red-star pulse-hint';
  el.style.setProperty('--hb', '2.4s');
  el.style.left = '50%';
  el.style.top = '30%';
  el.style.width = el.style.height = '8px';
  el.addEventListener('click', onRedStarClick);
  document.body.appendChild(el);
  redStarEl = el;
  return el;
}

function buildRoseStars() {
  rosePositions.forEach((pos, i) => {
    const el = document.createElement('div');
    el.className = 'star-point rose-star' + (i === 0 ? ' pulse-hint' : '');
    el.style.setProperty('--hb', `${2.8 + i * 0.4}s`);
    el.style.left = `${pos.x * 100}%`;
    el.style.top = `${pos.y * 100}%`;
    const sz = i === total - 1 ? 7 : stanzas[i].size;
    el.style.width = el.style.height = `${sz}px`;
    el.dataset.index = i;
    el.addEventListener('click', onStarClick);
    document.body.appendChild(el);
    starEls.push(el);
  });
}

// ─────────────────────────────────────────────
//  ROSE CURVE GEOMETRY — generated, not hand-drawn
//  A five-petal polar rose (r = R·(0.5 + 0.5·cos(5θ)))
//  for the bloom, plus a tightening inner spiral for the bud.
// ─────────────────────────────────────────────
function roseOuterPoints() {
  const pts = [];
  const steps = 140;
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const r = ROSE_OUTER_R * (0.5 + 0.5 * Math.cos(5 * t));
    pts.push({
      x: ROSE_CENTER.x + r * Math.cos(t),
      y: ROSE_CENTER.y + r * Math.sin(t) * ROSE_Y_SQUASH
    });
  }
  return pts;
}

function roseInnerSpiralPoints() {
  const pts = [];
  const steps = 60;
  const turns = 2.6;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const angle = t * turns * Math.PI * 2;
    const r = 0.115 * (1 - t) + 0.014;
    pts.push({
      x: ROSE_CENTER.x + r * Math.cos(angle),
      y: ROSE_CENTER.y + r * Math.sin(angle) * ROSE_Y_SQUASH
    });
  }
  return pts;
}

function pointsToPath(pts) {
  return pts
    .map((p, i) => `${i === 0 ? 'M' : 'L'}${(p.x * 100).toFixed(2)},${(p.y * 100).toFixed(2)}`)
    .join(' ');
}

function renderRoseCurve() {
  const outerPts = roseOuterPoints();
  const innerPts = roseInnerSpiralPoints();
  document.getElementById('rose-outer').setAttribute('d', pointsToPath(outerPts) + ' Z');
  document.getElementById('rose-inner').setAttribute('d', pointsToPath(innerPts));
  return { outerPts, innerPts };
}

let roseDustEls = [];

function buildRoseDust(outerPts, innerPts) {
  const dustPositions = [];
  // scatter along the outer bloom outline
  for (let i = 0; i < outerPts.length; i += 6) dustPositions.push(outerPts[i]);
  // scatter along the inner spiral
  for (let i = 0; i < innerPts.length; i += 5) dustPositions.push(innerPts[i]);

  dustPositions.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'rose-dust';
    el.style.left = `${p.x * 100}%`;
    el.style.top = `${p.y * 100}%`;
    const sz = 1 + Math.random() * 1.6;
    el.style.width = el.style.height = `${sz}px`;
    el.style.transitionDelay = `${(i % 12) * 90}ms`;
    document.body.appendChild(el);
    roseDustEls.push(el);
  });
}

// ─────────────────────────────────────────────
//  AUDIO — Web Audio ambient
// ─────────────────────────────────────────────
let audioCtx, masterGain, noiseNode, toneNodes = [];

function startAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 4);
  masterGain.connect(audioCtx.destination);

  // Wind-like noise
  const bufferSize = audioCtx.sampleRate * 4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  noiseNode = audioCtx.createBufferSource();
  noiseNode.buffer = buffer;
  noiseNode.loop = true;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 320;
  noiseFilter.Q.value = 0.5;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.035;
  noiseNode.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(masterGain);
  noiseNode.start();

  // Soft drone tones (Cm-ish: C2, G2, Eb3)
  [[65.4, 0.04], [98, 0.025], [155.6, 0.015], [207.7, 0.01]].forEach(([freq, gain]) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.value = gain;
    // slow tremolo
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.07 + Math.random() * 0.04;
    lfoGain.gain.value = gain * 0.3;
    lfo.connect(lfoGain);
    lfoGain.connect(g.gain);
    lfo.start();
    osc.connect(g);
    g.connect(masterGain);
    osc.start();
    toneNodes.push(osc);
  });
}

function chimeSound() {
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  const note = notes[Math.floor(Math.random() * notes.length)];
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = note;
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
  osc.connect(g);
  g.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 1.8);
}

function finalChime() {
  if (!audioCtx) return;
  [261.63, 329.63, 392, 523.25].forEach((freq, i) => {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.09, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);
      osc.connect(g);
      g.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + 3.5);
    }, i * 320);
  });
}

function warpSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 1.6;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(200, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(2200, audioCtx.currentTime + 0.9);
  filter.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 1.6);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.6);
  src.connect(filter);
  filter.connect(g);
  g.connect(masterGain);
  src.start();
  src.stop(audioCtx.currentTime + 1.6);
}

// ─────────────────────────────────────────────
//  SHOOTING STAR
// ─────────────────────────────────────────────
function shootingStar() {
  const el = document.createElement('div');
  el.className = 'shoot';
  const x = Math.random() * W * 0.6 + W * 0.1;
  const y = Math.random() * H * 0.4 + H * 0.05;
  const angle = 15 + Math.random() * 20;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.transform = `rotate(${angle}deg)`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

setInterval(() => {
  if (started && Math.random() < 0.35) shootingStar();
}, 6000);

// ─────────────────────────────────────────────
//  TYPEWRITER
// ─────────────────────────────────────────────
function typewrite(el, text, done) {
  el.innerHTML = '';
  const p = document.createElement('p');
  el.appendChild(p);

  const chars = text.split('');
  chars.forEach(ch => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === '\n' ? '\n' : ch;
    if (ch === '\n') span.style.display = 'block';
    p.appendChild(span);
  });

  const spans = p.querySelectorAll('.char');
  let i = 0;
  const speed = Math.max(18, 900 / spans.length);

  function tick() {
    if (i < spans.length) {
      spans[i].style.opacity = '1';
      i++;
      setTimeout(tick, speed);
    } else {
      if (done) done();
    }
  }
  tick();
}

// ─────────────────────────────────────────────
//  STANZA REVEAL
// ─────────────────────────────────────────────
const card = document.getElementById('active-card');
const counter = document.getElementById('counter');
const dismissHint = document.getElementById('dismiss-hint');
let dismissTimer = null;
let redStarTriggered = false;

// reading time scales gently with stanza length, clamped to a sane range
function autoDismissDelay(text) {
  const words = text.trim().split(/\s+/).length;
  return Math.max(4800, Math.min(11000, 2200 + words * 280));
}

function dismissCard() {
  clearTimeout(dismissTimer);
  if (!card.classList.contains('visible')) return;
  card.classList.remove('visible');

  if (revealed < total) {
    counter.textContent = 'find the next star  ✦';
    dismissHint.classList.remove('visible');
  } else {
    counter.style.opacity = '0';
    dismissHint.classList.remove('visible');
    if (act === 1 && !redStarTriggered) {
      redStarTriggered = true;
      setTimeout(buildRedStar, 1400);
    }
  }
}

function showStanza(index) {
  if (animating) return;
  animating = true;
  clearTimeout(dismissTimer);

  const s = stanzas[index];
  if (s.final) {
    card.classList.add('final');
  } else {
    card.classList.remove('final');
  }

  // fade out existing
  card.classList.remove('visible');
  setTimeout(() => {
    typewrite(card, s.lines, () => {
      animating = false;
      if (index < total - 1) {
        counter.textContent = `✦ ${index + 1} of ${total - 1} · find the next star`;
        dismissHint.classList.add('visible');
      } else {
        counter.style.opacity = '0';
        dismissHint.classList.remove('visible');
      }
      dismissTimer = setTimeout(dismissCard, autoDismissDelay(s.lines));
    });
    card.classList.add('visible');
  }, 400);

  // counter
  if (index < total - 1) {
    counter.textContent = '·';
  }
}

// ─────────────────────────────────────────────
//  STAR CLICK
// ─────────────────────────────────────────────
function onStarClick(e) {
  const i = parseInt(e.currentTarget.dataset.index);
  if (i !== revealed) return; // must click in order

  chimeSound();

  e.currentTarget.classList.remove('pulse-hint');
  e.currentTarget.classList.add('active');
  e.currentTarget.removeEventListener('click', onStarClick);

  // hint next star
  if (i + 1 < total) {
    setTimeout(() => {
      starEls[i + 1].classList.add('pulse-hint');
    }, 1200);
  }

  revealed++;
  showStanza(i);

  if (i === total - 1) {
    // poem complete
    finalChime();
    document.getElementById('end-bloom').classList.add('lit');
    setTimeout(shootingStar, 1000);
    setTimeout(shootingStar, 2200);
    setTimeout(shootingStar, 3800);
  }
}

// ─────────────────────────────────────────────
//  RED STAR → HYPERSPACE → ROSE CONSTELLATION
// ─────────────────────────────────────────────
function onRedStarClick(e) {
  const el = e.currentTarget;
  el.removeEventListener('click', onRedStarClick);
  el.classList.remove('pulse-hint');
  el.classList.add('active');
  warpSound();

  counter.style.opacity = '0';
  dismissHint.classList.remove('visible');

  setTimeout(() => { if (redStarEl) redStarEl.remove(); }, 500);

  startWarp();
}

function startWarp() {
  warping = true;
  warpStart = performance.now();
  warpParticles = [];
  document.body.classList.add('warping');
  document.getElementById('end-bloom').classList.remove('lit');

  // the first poem's stars fade away as we travel
  starEls.forEach(el => {
    el.style.transition = 'opacity 0.9s ease';
    el.style.opacity = '0';
  });
  setTimeout(() => {
    starEls.forEach(el => el.remove());
    starEls.length = 0;
  }, 900);

  setTimeout(() => {
    warping = false;
    document.body.classList.remove('warping');
    beginRoseAct();
  }, WARP_DURATION);
}

function beginRoseAct() {
  act = 2;

  const { outerPts, innerPts } = renderRoseCurve();
  buildRoseDust(outerPts, innerPts);

  document.getElementById('rose-lines').classList.add('visible');
  setTimeout(() => {
    roseDustEls.forEach(el => el.classList.add('visible'));
  }, 200);

  const caption = document.getElementById('rose-caption');
  caption.classList.add('visible');
  setTimeout(() => caption.classList.remove('visible'), 3600);

  setTimeout(() => {
    stanzas = stanzas2;
    total = stanzas.length;
    revealed = 0;
    buildRoseStars();
    counter.style.opacity = '1';
    counter.textContent = 'touch a star  ✦';
    starEls[0].classList.add('pulse-hint');
  }, 1800);
}

// click-away to dismiss stanza (also works on the final stanza)
document.addEventListener('click', (e) => {
  if (e.target.closest('.star-point') || e.target.closest('#intro') || e.target.closest('#begin-btn')) return;
  if (!animating && card.classList.contains('visible')) {
    dismissCard();
  }
});

// ─────────────────────────────────────────────
//  INTRO
// ─────────────────────────────────────────────
document.getElementById('begin-btn').addEventListener('click', () => {
  startAudio();
  started = true;
  document.getElementById('intro').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('intro').remove();
    counter.textContent = 'touch a star  ✦';
    starEls[0].classList.add('pulse-hint');
  }, 1300);
  shootingStar();
});

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  resize();
  makeBgStars(Math.floor((W * H) / 4000));
});

resize();
makeBgStars(Math.floor((W * H) / 4000));
buildStars();
loop();
</script>
